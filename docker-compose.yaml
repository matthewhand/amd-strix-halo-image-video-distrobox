# Docker Compose v2 for AMD Strix Halo Image & Video Toolbox
#
# Profiles:
#   qwen-image   → Qwen Image Studio server on :${QWEN_PORT:-8180}
#   mage-image   → Mage-Flow Turbo image worker on :${MAGE_PORT:-8181}
#   homie-video  → HOMIE subject-to-video (Wan2.1-14B) on :${HOMIE_PORT:-8192}
#   qwen-tts     → Qwen3-TTS server on :8010 (HSA_OVERRIDE_GFX_VERSION=11.0.0)
#   comfyui      → ComfyUI server on :8188
#   slopfinity   → Slopfinity dashboard on :9099 (see override)
#   slop         → umbrella for the full stack (all of the above)
#
# Full stack:      docker compose --profile slop up -d
# Image-only:      docker compose --profile qwen-image up -d
# Mage-only:       docker compose --profile mage-image up -d
# HOMIE-only:      docker compose --profile homie-video up -d
# ComfyUI-only:    docker compose --profile comfyui up -d
#
# Override ports and paths via .env (see .env.example).

services:
  strix-halo-toolbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: amd-strix-halo-image-video-toolbox:latest
    container_name: strix-halo-toolbox
    restart: unless-stopped

    # Toolbox is a pure shell / build anchor. No profile means it starts under
    # `docker compose up`. The real servers live in the dedicated service
    # profiles below — use `docker exec -it strix-halo-toolbox bash` for a
    # ROCm REPL.

    # Run as host user so mounted files have correct ownership
    user: "${UID:-1000}:${GID:-1000}"

    # GPU and system access
    network_mode: host
    privileged: true
    environment:
      # Set HOME for non-root user (mount targets use this path)
      - HOME=/home/user

      # ROCm / Triton / Flash-Attention environment (CRITICAL for gfx1151)
      # 11.5.1 is required for Strix Halo GPU operations.
      - HSA_OVERRIDE_GFX_VERSION=11.5.1
      - FLASH_ATTENTION_TRITON_AMD_ENABLE=false
      - QWEN_FA_SHIM=1
      - WAN_ATTENTION_BACKEND=sdpa
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:1024,garbage_collection_threshold:0.8
      - HIP_VISIBLE_DEVICES=0
      - ROC_ENABLE_PRE_VEGA=1

      # torchaudio linker fix
      - LD_LIBRARY_PATH=/opt/venv/lib/python3.13/site-packages/torch/lib:${LD_LIBRARY_PATH:-}

      # Explicitly point to CLI wrapper
      - QIM_CLI_PATH=/opt/qwen-image-studio/qwen-image-mps.py

      # Fast model downloads
      - HF_HUB_ENABLE_HF_TRANSFER=1

      # Service Configuration (set to 0 to disable in start_docker.sh)
      # - QWEN_PORT=8000
      # - COMFYUI_PORT=8188

    volumes:
      # GPU device access
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd

      # Persist models and outputs (override paths in .env)
      - ${HF_CACHE:-./huggingface-cache}:/home/user/.cache/huggingface
      - ${QWEN_OUTPUTS:-./qwen-outputs}:/home/user/.qwen-image-studio
      - ${WAN_MODELS:-./wan-models}:/home/user/wan-models
      - ${COMFY_MODELS:-./comfy-models}:/opt/ComfyUI/models
      - ${COMFY_INPUT:-./comfy-input}:/opt/ComfyUI/input
      - ${COMFY_OUTPUTS:-./comfy-outputs}:/opt/ComfyUI/output
      - ./scripts/start_docker.sh:/opt/start_docker.sh:ro

    security_opt:
      - seccomp:unconfined

    working_dir: /workspace

    # Toolbox is now a pure shell. Real servers live in qwen-image-service
    # and comfyui-service (see below). Keeping /opt/start_docker.sh mounted
    # for manual invocation if someone needs the legacy all-in-one behavior.
    command: ["tail", "-f", "/dev/null"]

  # Qwen-Image-only service profile. Separate from qwen-tts (P4, port 8010)
  # so the profile name reflects modality. Port is ${QWEN_PORT} (default 8180
  # so it does not collide with LiteLLM / other hub services on :8000).
  # Pre-flight guard exits cleanly if the chosen port is already bound.
  qwen-image-service:
    extends: strix-halo-toolbox
    container_name: strix-halo-qwen-image
    profiles:
      - qwen-image
      - slop
    environment:
      - QWEN_PORT=${QWEN_PORT:-8180}
    command: >
      bash -c "
        PORT=$${QWEN_PORT:-8180}
        if (echo > /dev/tcp/127.0.0.1/$$PORT) 2>/dev/null ; then
          echo \"ERROR: Port $$PORT is already bound (likely a toolbox running start_docker.sh).\" 1>&2
          echo '       Stop the other Qwen server first, or change QWEN_PORT.' 1>&2
          sleep 30
          exit 0
        fi
        echo \"🎨 Starting Qwen Image Studio on port $$PORT...\"
        if [ -f /opt/qwen_launcher.py ] && [ -f /opt/qwen-image-studio/qwen-image-studio/server.py ]; then
          cp /opt/qwen_launcher.py /opt/qwen-image-studio/qwen-image-mps.py
        fi
        cd /opt/qwen-image-studio/qwen-image-studio
        exec uvicorn server:app --host 0.0.0.0 --port $$PORT
      "

  # Mage-Flow image worker (microsoft/Mage-Flow-Turbo by default). SDPA
  # attention backend for ROCm/gfx1151 — no CUDA flash-attn required.
  # Port ${MAGE_PORT:-8181}. Writes PNGs under comfy-outputs/mage/.
  mage-image-service:
    extends: strix-halo-toolbox
    container_name: strix-halo-mage-image
    # ROOT: same reason as comfyui — torch+ROCm device enum needs uid 0
    # on this host for reliable HIP init under long-lived workers.
    user: "0:0"
    profiles:
      - mage-image
      - slop
    environment:
      - USER=root
      - MAGE_PORT=${MAGE_PORT:-8181}
      # Prefer the on-disk Turbo snapshot (17GB). HF hub id is fallback only.
      - MAGE_MODEL=${MAGE_MODEL:-/models/Mage-Flow-Turbo}
      - MAGE_STEPS=${MAGE_STEPS:-4}
      - MAGE_CFG=${MAGE_CFG:-1.0}
      - MAGE_ATTN_BACKEND=${MAGE_ATTN_BACKEND:-sdpa}
      - MAGE_ATTN=${MAGE_ATTN_BACKEND:-sdpa}
      - VF_HF_ATTN_IMPL=${VF_HF_ATTN_IMPL:-sdpa}
      - MAGE_FA_SHIM=1
      # Enable experimental ROCm SDPA kernels (gfx1151).
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=${TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL:-1}
      # Content filter uses Qwen3-VL .generate(); fail-open by default on ROCm.
      - MAGE_CONTENT_FILTER=${MAGE_CONTENT_FILTER:-0}
      # Preload so first /api/generate is fast (model ~20s to load once).
      - MAGE_PRELOAD=${MAGE_PRELOAD:-1}
      - MAGE_OUT_DIR=/opt/ComfyUI/output/mage
      - MAGE_ROOT=/opt/Mage
      - MAGE_FLOW_ROOT=/opt/Mage/mage_flow
      - HF_HOME=/home/user/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/home/user/.cache/huggingface/hub
      - HF_XET_HIGH_PERFORMANCE=${HF_XET_HIGH_PERFORMANCE:-1}
    volumes:
      - ${HF_CACHE:-./huggingface-cache}:/home/user/.cache/huggingface
      # Complete Turbo weights live under the project huggingface-cache even when
      # HF_CACHE points at /mnt/downloads (shared hub). Bind them explicitly.
      - ${MAGE_LOCAL_DIR:-./huggingface-cache/local/Mage-Flow-Turbo}:/models/Mage-Flow-Turbo:ro
      - ${COMFY_OUTPUTS:-./comfy-outputs}:/opt/ComfyUI/output
      - ./Mage:/opt/Mage:ro
      - ./scripts/mage_launcher.py:/opt/mage_launcher.py:ro
      - ./scripts/mage_serve.py:/opt/mage_serve.py:ro
    command: >
      bash -c "
        PORT=$${MAGE_PORT:-8181}
        if (echo > /dev/tcp/127.0.0.1/$$PORT) 2>/dev/null ; then
          echo \"ERROR: Port $$PORT is already bound.\" 1>&2
          sleep 30
          exit 0
        fi
        mkdir -p /opt/ComfyUI/output/mage
        # Prefer local Turbo snapshot if present (avoids multi-GB Hub re-download).
        if [ -f /models/Mage-Flow-Turbo/model_index.json ]; then
          export MAGE_MODEL=/models/Mage-Flow-Turbo
        elif [ -f /home/user/.cache/huggingface/local/Mage-Flow-Turbo/model_index.json ]; then
          export MAGE_MODEL=/home/user/.cache/huggingface/local/Mage-Flow-Turbo
        fi
        echo \"🎨 Starting Mage-Flow image worker on port $$PORT (model=$${MAGE_MODEL:-microsoft/Mage-Flow-Turbo})...\"
        export PYTHONPATH=/opt/Mage:$${PYTHONPATH:-}
        export VF_HF_ATTN_IMPL=$${VF_HF_ATTN_IMPL:-sdpa}
        export MAGE_CONTENT_FILTER=$${MAGE_CONTENT_FILTER:-0}
        exec python3 /opt/mage_serve.py
      "

  # HOMIE subject-to-video (https://github.com/YIYANGCAI/HOMIE) — Wan2.1-T2V-14B
  # + trained Homie weights. Reference-image → video personalization.
  # Port ${HOMIE_PORT:-8192}. Weights must be downloaded separately (see README).
  # UMA-heavy: do not co-warm with Mage/Qwen/Comfy.
  homie-video-service:
    extends: strix-halo-toolbox
    container_name: strix-halo-homie-video
    user: "0:0"
    profiles:
      - homie-video
      - slop
    environment:
      - USER=root
      - HOMIE_PORT=${HOMIE_PORT:-8192}
      - HOMIE_ROOT=/opt/HOMIE
      - HOMIE_CKPT_DIR=${HOMIE_CKPT_DIR:-/opt/weights/Wan2.1-T2V-14B-Diffusers}
      - HOMIE_WEIGHTS=${HOMIE_WEIGHTS:-/opt/weights/HOMIE-Wan-Model}
      - HOMIE_SIZE=${HOMIE_SIZE:-832*480}
      - HOMIE_FRAMES=${HOMIE_FRAMES:-49}
      - HOMIE_STEPS=${HOMIE_STEPS:-50}
      - HOMIE_CFG=${HOMIE_CFG:-5.0}
      - HOMIE_FPS=${HOMIE_FPS:-16}
      - HOMIE_FA_SHIM=1
      - HOMIE_OFFLOAD=${HOMIE_OFFLOAD:-1}
      - HOMIE_OUT_DIR=/opt/ComfyUI/output/homie
      - HOMIE_LAUNCHER=/opt/homie_launcher.py
      - HF_HOME=/home/user/.cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/home/user/.cache/huggingface/hub
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE:-./huggingface-cache}:/home/user/.cache/huggingface
      - ${COMFY_OUTPUTS:-./comfy-outputs}:/opt/ComfyUI/output
      - ${HOMIE_WEIGHTS_HOST:-./homie-weights}:/opt/weights
      - ./HOMIE:/opt/HOMIE:ro
      - ./scripts/homie_launcher.py:/opt/homie_launcher.py:ro
      - ./scripts/homie_serve.py:/opt/homie_serve.py:ro
    command: >
      bash -c "
        PORT=$${HOMIE_PORT:-8192}
        if (echo > /dev/tcp/127.0.0.1/$$PORT) 2>/dev/null ; then
          echo \"ERROR: Port $$PORT is already bound.\" 1>&2
          sleep 30
          exit 0
        fi
        mkdir -p /opt/ComfyUI/output/homie /opt/weights
        echo \"🎬 Starting HOMIE video worker on port $$PORT (weights=$${HOMIE_WEIGHTS:-/opt/weights/HOMIE-Wan-Model})...\"
        export PYTHONPATH=/opt/HOMIE:$${PYTHONPATH:-}
        exec python3 /opt/homie_serve.py
      "

  # Qwen3-TTS service profile on :8010. Separate from qwen-image (:8000) so
  # you can run TTS independently. Enforces HSA_OVERRIDE_GFX_VERSION=11.0.0
  # (NOT the 11.5.1 used by the rest of the stack — the TTS model's kernels
  # regress under 11.5.1 on gfx1151).
  qwen-tts-service:
    extends: strix-halo-toolbox
    container_name: strix-halo-qwen-tts
    profiles:
      - qwen-tts
      - slop
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      # Redirect HuggingFace cache to a writable bind-mounted path. The default
      # /home/user/.cache/huggingface is read-only for the container UID once
      # the model tries to materialize the CustomVoice subdir, causing every
      # /tts call to crash with PermissionError. /workspace is the slopfinity
      # bind mount of ./comfy-outputs/experiments on the host.
      - HF_HOME=/workspace/.hf-tts-cache
      # USER + LOGNAME — Qwen3-TTS's CustomVoice loader calls
      # `getpass.getuser()` to derive a sanitized voice-bank dirname.
      # In containers without /etc/passwd entries for the runtime UID
      # (or with USER/LOGNAME unset), getpass raises
      # `OSError: No username set in the environment`, returning HTTP
      # 500 on every /tts request. Setting either env var resolves
      # without needing to rebuild the image. "slopfinity" is just a
      # stable identifier — the dirname becomes
      # /workspace/.hf-tts-cache/.../slopfinity_<voice>/.
      - USER=slopfinity
      - LOGNAME=slopfinity
    volumes:
      - ./comfy-outputs/experiments:/workspace
      - ./scripts/qwen_tts_launcher.py:/opt/qwen_tts_launcher.py:ro
      - ./scripts/qwen_tts_serve.py:/opt/qwen_tts_serve.py:ro
      - ./scripts/kokoro_tts_launcher.py:/opt/kokoro_tts_launcher.py:ro
    command: >
      bash -c "
        if (echo > /dev/tcp/127.0.0.1/8010) 2>/dev/null ; then
          echo 'ERROR: Port 8010 is already bound.' 1>&2
          echo '       Stop the other TTS worker first, or change TTS_PORT.' 1>&2
          sleep 30
          exit 0
        fi
        # /workspace/tts is the bind-mount that the slopfinity dashboard
        # serves at /files/tts/<name>. The compose `mkdir -p` is
        # idempotent; the chown attempt is best-effort (it works for
        # the first container ever to run with this UID, but if the
        # host dir is already owned by a different UID, the in-
        # container chown can't escalate).
        #
        # Operator one-time setup (only if /tts files end up at
        # /tmp/slopfinity-tts/ instead of /workspace/tts/):
        #   sudo chown -R $(id -u):$(id -g) ./comfy-outputs/experiments/tts
        # The dashboard's /files/tts/<name> route reads from EXP_DIR
        # on the host; if the chown isn't done, _first_writable in
        # qwen_tts_serve.py falls back to /tmp/slopfinity-tts inside
        # the container — files are generated but the dashboard can't
        # serve them.
        mkdir -p /workspace/tts && chown -R $(id -u):$(id -g) /workspace/tts 2>/dev/null || true
        # Multi-engine TTS: kokoro-onnx is the default (CPU, no ROCm
        # kernel issues on gfx1151) and is pip-installed on every
        # container start since the toolbox image doesn't bake it in.
        # Persists as long as the container's overlay fs lives; recreate
        # = reinstall (~10s, cheap).
        echo '📦 Installing kokoro-onnx (default engine)...'
        pip install --quiet kokoro-onnx || echo 'WARN: kokoro install failed; only qwen path will work'
        # Force the worker to use /workspace/tts so files are served by
        # the dashboard at /files/tts/<name>. Avoids the /tmp fallback.
        export TTS_OUT_DIR=/workspace/tts
        echo '🎙️  Starting TTS worker on :8010 (default engine: kokoro, out=/workspace/tts)...'
        exec python3 /opt/qwen_tts_serve.py
      "

  # HeartMuLa music worker on :8011 (scripts/heartmula_serve.py). Opt-in
  # profile (NOT in `slop`): the worker subprocesses the launcher per request
  # — same cost as the legacy `docker run --rm` path run_fleet uses when
  # HEARTMULA_URL is unset, so only run it if you've pointed run_fleet at it
  # (HEARTMULA_URL=http://localhost:8011/music).
  heartmula-service:
    extends: strix-halo-toolbox
    container_name: strix-halo-heartmula
    profiles:
      - heartmula
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.5.1
      - HEARTMULA_OUT_DIR=/workspace/music
    volumes:
      - ./comfy-outputs/experiments:/workspace
      - ./scripts/heartmula_launcher.py:/opt/heartmula_launcher.py:ro
      - ./scripts/heartmula_serve.py:/opt/heartmula_serve.py:ro
      - /mnt/downloads/comfy-models:/mnt/downloads/comfy-models:ro
    command: >
      bash -c "
        if (echo > /dev/tcp/127.0.0.1/8011) 2>/dev/null ; then
          echo 'ERROR: Port 8011 is already bound.' 1>&2
          sleep 30
          exit 0
        fi
        # /workspace/music is served by the dashboard at /files/music/<name>;
        # run_fleet resolves the worker's returned URL back to this dir.
        mkdir -p /workspace/music && chown -R $(id -u):$(id -g) /workspace/music 2>/dev/null || true
        echo '🎼 Starting HeartMuLa music worker on :8011 (out=/workspace/music)...'
        exec python3 /opt/heartmula_serve.py
      "

  # ComfyUI-only service profile. Mutually exclusive with a toolbox running
  # start_docker.sh on :8188.
  comfyui-service:
    extends: strix-halo-toolbox
    container_name: strix-halo-comfyui
    profiles:
      - comfyui
      - slop
    # ROOT user is required for torch+ROCm to enumerate the GPU. Even with
    # /dev/kfd mode 666 + privileged + render-group membership, AMDGPU's
    # init blocks non-root processes (`torch.cuda.is_available() → False` as
    # uid 1000, True as uid 0). The toolbox container can run unprivileged
    # because qwen-image-mps does its own GPU init dance, but ComfyUI hits
    # the device-enumeration path at module-import time.
    user: "0:0"
    # `USER` must be set so torch._dynamo's cache_dir() can call getpass.getuser()
    # without raising — was crash-looping on `OSError: No username set`.
    environment:
      - USER=root
    command: >
      bash -c "
        if (echo > /dev/tcp/127.0.0.1/8188) 2>/dev/null ; then
          echo 'ERROR: Port 8188 is already bound (likely a toolbox running start_docker.sh).' 1>&2
          echo '       Stop the other ComfyUI server first.' 1>&2
          sleep 30
          exit 0
        fi
        echo '🖼️  Starting ComfyUI (FP16 weights, FP32 VAE)...'
        cd /opt/ComfyUI
        # --fp32-vae: forces every VAE decode to fp32 regardless of the
        #   model's native dtype. On Strix Halo (gfx1151) bf16/fp16 VAE
        #   decodes produce a faint 8/16-px block-grid pattern in some
        #   models (LTX-Video-2.3 especially); fp32 eliminates it. Costs
        #   ~2× VAE-decode VRAM, fine on UMA. See README §14 + the
        #   slop-card "⚠ vae grid" chip's tooltip for context.
        exec python3 main.py --listen 0.0.0.0 --port 8188 --output-directory /opt/ComfyUI/output --force-fp16 --fp32-vae
      "
